{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: imageshift-v2-manager-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["spectrocloud-labs.github.com"]
  resources: ["imageshifts"]
  verbs: ["get", "list", "watch"]
{{- end -}}
