---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups:
  - imageshift.dev
  resources:
  - imageshifts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - imageshift.dev
  resources:
  - imageshifts/finalizers
  verbs:
  - update
- apiGroups:
  - imageshift.dev
  resources:
  - imageshifts/status
  verbs:
  - get
  - patch
  - update
