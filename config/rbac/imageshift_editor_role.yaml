# This rule is not used by the project imageshift-v2 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the imageshift.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: imageshift-v2
    app.kubernetes.io/managed-by: kustomize
  name: imageshift-editor-role
rules:
- apiGroups:
  - imageshift.dev
  resources:
  - imageshifts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - imageshift.dev
  resources:
  - imageshifts/status
  verbs:
  - get
